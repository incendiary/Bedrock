name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The gitleaks action reads PR commits via the API, which needs these grants on
# private repositories. Without them the default token returns HTTP 403.
permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check shell script syntax
        run: bash -n new-project.sh

      - name: Validate YAML files
        run: |
          pip install --quiet yamllint==1.38.0
          yamllint -d relaxed \
            .github/workflows/ci.yml \
            python-template/.pre-commit-config.yaml \
            python-template/.github/workflows/ci.yml \
            python-template/.github/dependabot.yml \
            csharp-template/.pre-commit-config.yaml \
            csharp-template/.github/workflows/ci.yml \
            csharp-template/.github/dependabot.yml \
            cpp-template/.pre-commit-config.yaml \
            cpp-template/.github/workflows/ci.yml \
            cpp-template/.github/dependabot.yml \
            node-spa-template/.pre-commit-config.yaml \
            node-spa-template/.github/workflows/ci.yml \
            node-spa-template/.github/dependabot.yml \
            iac-template/.pre-commit-config.yaml \
            iac-template/.github/workflows/ci.yml \
            iac-template/.github/dependabot.yml

      - name: Secret baseline check
        run: |  # pragma: allowlist secret
          pip install detect-secrets==1.5.0
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Pattern matching — fast local-style gate in CI
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Verified credential detection — confirms live secrets via provider APIs
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@17456f8c7d042d8c82c9a8ca9e937231f9f42e26 # v3.95.2
        with:
          extra_args: --results=verified,unknown
